<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard Absensi OJT — Lotus Garden Hotel & Restaurant</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --cream:#FFFCF0; --cream-deep:#F5EFDA; --ink:#2B2417; --ink-soft:#6b6252;
    --gold:#C9A84C; --gold-deep:#a8863a; --green:#21362B;
    --ok:#3F7052; --ok-bg:#e7f0e8; --warn:#B5483D; --warn-bg:#fbeae7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:'Jost',sans-serif; color:var(--ink); background:var(--cream);
    min-height:100dvh;
  }
  h1,h2,h3{ font-family:'Cormorant Garamond', serif; margin:0; }

  /* ---------- LOGIN ---------- */
  #screenLogin{
    min-height:100dvh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .login-card{
    width:100%; max-width:360px; background:#fff; border-radius:16px; padding:30px 26px;
    box-shadow:0 18px 40px -18px rgba(43,36,23,.35); border:1px solid rgba(201,168,76,.25); text-align:center;
  }
  .login-card img{ width:52px; margin-bottom:10px; }
  .login-card h1{ font-size:21px; }
  .login-card .sub{ font-size:11.5px; letter-spacing:2px; text-transform:uppercase; color:var(--gold-deep); margin:4px 0 20px; font-weight:600;}
  .field{ text-align:left; margin-bottom:14px; }
  .field label{ display:block; font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; font-weight:500;}
  .field input, .field select{
    width:100%; padding:12px 13px; border-radius:9px; border:1.5px solid #e6dfc9; background:var(--cream);
    font-family:'Jost',sans-serif; font-size:15px; color:var(--ink); outline:none;
  }
  .field input:focus, .field select:focus{ border-color:var(--gold); }
  .btn{ border:none; border-radius:9px; padding:12px 18px; font-family:'Jost',sans-serif; font-weight:600;
    font-size:14px; cursor:pointer; background:var(--gold); color:#fff; width:100%; }
  .btn:hover{ background:var(--gold-deep); }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .err-msg{ background:var(--warn-bg); color:var(--warn); font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:14px; display:none; text-align:left;}

  /* ---------- DASHBOARD ---------- */
  #screenDash{ display:none; }
  header.topbar{
    background:linear-gradient(135deg, var(--green), #16241c); color:var(--cream);
    padding:16px 18px; display:flex; align-items:center; gap:12px; position:sticky; top:0; z-index:10;
  }
  header.topbar img{ width:34px; height:34px; object-fit:contain; }
  header.topbar .ttl{ font-family:'Cormorant Garamond', serif; font-size:18px; line-height:1.1; }
  header.topbar .ttl small{ display:block; font-family:'Jost',sans-serif; font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold); font-weight:600; margin-top:2px;}
  header.topbar .logout{ margin-left:auto; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25);
    color:#fff; font-size:12px; padding:8px 12px; border-radius:8px; cursor:pointer; font-family:'Jost',sans-serif; }

  main{ padding:18px; max-width:1100px; margin:0 auto; }

  .filters{
    background:#fff; border-radius:14px; padding:16px; margin-bottom:18px; border:1px solid #eee3c4;
    display:grid; grid-template-columns:1fr 1fr; gap:12px;
  }
  .filters .field{ margin-bottom:0; }
  .filters .actions{ grid-column:1 / -1; display:flex; gap:10px; }
  .filters .actions .btn{ flex:1; }
  .btn-outline{ background:#fff; color:var(--green); border:1.5px solid var(--green); }
  .btn-outline:hover{ background:var(--cream-deep); }

  .cards{ display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:18px; }
  .stat-card{ background:#fff; border-radius:12px; padding:14px 16px; border:1px solid #eee3c4; }
  .stat-card .k{ font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink-soft); font-weight:500;}
  .stat-card .v{ font-family:'Cormorant Garamond', serif; font-weight:700; font-size:28px; margin-top:4px; }
  .stat-card.warn .v{ color:var(--warn); }
  .stat-card.ok .v{ color:var(--ok); }

  .panel{ background:#fff; border-radius:14px; padding:16px; margin-bottom:18px; border:1px solid #eee3c4; }
  .panel h2{ font-size:17px; margin-bottom:12px; }
  .chart-wrap{ position:relative; height:220px; }

  .table-scroll{ overflow-x:auto; -webkit-overflow-scrolling:touch; }
  table{ width:100%; border-collapse:collapse; font-size:13px; min-width:640px; }
  thead th{
    text-align:left; font-size:10.5px; letter-spacing:.8px; text-transform:uppercase; color:var(--ink-soft);
    padding:8px 10px; border-bottom:2px solid var(--cream-deep); white-space:nowrap; font-weight:600;
  }
  tbody td{ padding:9px 10px; border-bottom:1px solid #f2ede0; white-space:nowrap; }
  tbody tr:hover{ background:var(--cream); }
  .badge{ display:inline-block; padding:3px 9px; border-radius:20px; font-size:11px; font-weight:600; }
  .badge.masuk{ background:var(--ok-bg); color:var(--ok); }
  .badge.pulang{ background:#e8eef7; color:#3a5a8c; }
  .badge.terlambat{ background:var(--warn-bg); color:var(--warn); margin-left:6px; }
  .empty-state{ text-align:center; padding:36px 10px; color:var(--ink-soft); font-size:13.5px; }

  .loading-row{ text-align:center; padding:24px; color:var(--ink-soft); font-size:13px; }
  .spin{ width:15px; height:15px; border-radius:50%; border:2px solid rgba(43,36,23,.2); border-top-color:var(--gold);
    display:inline-block; vertical-align:-3px; margin-right:6px; animation:spin .7s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  @media (min-width:720px){
    .cards{ grid-template-columns:repeat(4,1fr); }
    .charts-row{ display:grid; grid-template-columns:1.4fr 1fr; gap:18px; }
  }
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="screenLogin">
  <div class="login-card">
    <img src="logo.png" alt="Lotus Garden">
    <h1>Dashboard Absensi</h1>
    <div class="sub">Khusus Admin / HRD</div>
    <div class="err-msg" id="loginErr"></div>
    <div class="field">
      <label>Password Admin</label>
      <input id="inpPass" type="password" autocomplete="off" placeholder="••••••••">
    </div>
    <button class="btn" id="btnLogin" onclick="doAdminLogin()">Masuk</button>
  </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div id="screenDash">
  <header class="topbar">
    <img src="logo.png" alt="Lotus Garden">
    <div class="ttl">Lotus Garden Hotel &amp; Restaurant<small>Dashboard Absensi OJT</small></div>
    <button class="logout" onclick="doAdminLogout()">Keluar</button>
  </header>

  <main>
    <div class="filters">
      <div class="field">
        <label>Dari Tanggal</label>
        <input type="date" id="fStart">
      </div>
      <div class="field">
        <label>Sampai Tanggal</label>
        <input type="date" id="fEnd">
      </div>
      <div class="field" style="grid-column:1 / -1;">
        <label>Departemen</label>
        <select id="fDept"><option value="">Semua Departemen</option></select>
      </div>
      <div class="actions">
        <button class="btn" onclick="loadData()">Terapkan Filter</button>
        <button class="btn btn-outline" onclick="exportExcel()">⬇ Export Excel</button>
      </div>
    </div>

    <div class="cards">
      <div class="stat-card"><div class="k">Peserta OJT Aktif</div><div class="v" id="statAktif">—</div></div>
      <div class="stat-card ok"><div class="k">Hadir Hari Ini</div><div class="v" id="statHadirHariIni">—</div></div>
      <div class="stat-card warn"><div class="k">Total Terlambat</div><div class="v" id="statTerlambat">—</div></div>
      <div class="stat-card"><div class="k">Total Record</div><div class="v" id="statTotal">—</div></div>
    </div>

    <div class="charts-row">
      <div class="panel">
        <h2>Tren Kehadiran Harian</h2>
        <div class="chart-wrap"><canvas id="chartKehadiran"></canvas></div>
      </div>
      <div class="panel">
        <h2>Tepat Waktu vs Terlambat</h2>
        <div class="chart-wrap"><canvas id="chartTerlambat"></canvas></div>
      </div>
    </div>

    <div class="panel">
      <h2>Rekap Absensi</h2>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th>Tanggal</th><th>ID OJT</th><th>Nama</th><th>Departemen</th>
              <th>Jenis</th><th>Jam</th><th>Jarak</th>
            </tr>
          </thead>
          <tbody id="tblBody">
            <tr><td colspan="7" class="loading-row">Memuat data…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script>
/* ====== KONFIGURASI ====== */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzic3Q5FPbOZskgph0ZrWvuKQr7WH7KgT_pDm2btFi2irMajpoacLKO199jPoHwTld9Nw/exec';

const $ = (id) => document.getElementById(id);
let adminToken = localStorage.getItem('absensi_admin_token') || null;
let currentRows = [];
let chartKehadiranInst = null, chartTerlambatInst = null;

async function callApi(payload){
  const res = await fetch(GAS_URL, { method:'POST', body: JSON.stringify(payload) });
  return res.json();
}

/* ====== LOGIN ====== */
async function doAdminLogin(){
  const password = $('inpPass').value.trim();
  const err = $('loginErr');
  err.style.display = 'none';
  if(!password){ err.textContent = 'Password wajib diisi.'; err.style.display='block'; return; }

  const btn = $('btnLogin');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Memeriksa…';
  try{
    const r = await callApi({ action:'adminLogin', password });
    if(!r.success){ err.textContent = r.message || 'Login gagal.'; err.style.display='block'; return; }
    adminToken = r.token;
    localStorage.setItem('absensi_admin_token', adminToken);
    enterDashboard();
  }catch(e){
    err.textContent = 'Tidak dapat terhubung ke server.'; err.style.display='block';
  }finally{
    btn.disabled = false; btn.textContent = 'Masuk';
  }
}

function doAdminLogout(){
  localStorage.removeItem('absensi_admin_token');
  adminToken = null;
  $('screenDash').style.display = 'none';
  $('screenLogin').style.display = 'flex';
  $('inpPass').value = '';
}

/* ====== DASHBOARD ====== */
function enterDashboard(){
  $('screenLogin').style.display = 'none';
  $('screenDash').style.display = 'block';

  const today = new Date();
  const first = new Date(today.getFullYear(), today.getMonth(), 1);
  $('fStart').value = first.toISOString().slice(0,10);
  $('fEnd').value = today.toISOString().slice(0,10);

  loadData();
}

async function loadData(){
  const startDate = $('fStart').value;
  const endDate = $('fEnd').value;
  const departemen = $('fDept').value;
  if(!startDate || !endDate){ return; }

  $('tblBody').innerHTML = '<tr><td colspan="7" class="loading-row"><span class="spin"></span>Memuat data…</td></tr>';

  try{
    const r = await callApi({ action:'adminGetData', token: adminToken, startDate, endDate, departemen });
    if(!r.success){
      if(r.forceLogout){ doAdminLogout(); return; }
      $('tblBody').innerHTML = `<tr><td colspan="7" class="empty-state">${r.message || 'Gagal memuat data.'}</td></tr>`;
      return;
    }
    currentRows = r.rows;
    renderDeptFilter(r.daftarDepartemen, departemen);
    renderSummary(r.summary);
    renderTable(r.rows);
    renderCharts(r.chartKehadiran, r.summary);
  }catch(e){
    $('tblBody').innerHTML = '<tr><td colspan="7" class="empty-state">Tidak dapat terhubung ke server.</td></tr>';
  }
}

function renderDeptFilter(list, selected){
  const sel = $('fDept');
  const current = selected || sel.value;
  sel.innerHTML = '<option value="">Semua Departemen</option>' +
    list.map(d => `<option value="${d}">${d}</option>`).join('');
  sel.value = current;
}

function renderSummary(s){
  $('statAktif').textContent = s.totalPesertaAktif;
  $('statHadirHariIni').textContent = s.hadirHariIni;
  $('statTerlambat').textContent = s.totalTerlambat;
  $('statTotal').textContent = s.totalRecord;
}

function renderTable(rows){
  if(!rows.length){
    $('tblBody').innerHTML = '<tr><td colspan="7" class="empty-state">Tidak ada data absensi pada rentang/filter ini.</td></tr>';
    return;
  }
  $('tblBody').innerHTML = rows.map(r => `
    <tr>
      <td>${r.tanggal}</td>
      <td>${r.id}</td>
      <td>${r.nama}</td>
      <td>${r.departemen || '-'}</td>
      <td><span class="badge ${r.jenis === 'Masuk' ? 'masuk' : 'pulang'}">${r.jenis}</span>${r.terlambat ? '<span class="badge terlambat">Terlambat</span>' : ''}</td>
      <td>${r.jam}</td>
      <td>${r.jarak} m</td>
    </tr>
  `).join('');
}

function renderCharts(chartKehadiran, summary){
  const labels = chartKehadiran.map(d => d.tanggal.slice(5));
  const data = chartKehadiran.map(d => d.jumlah);

  if(chartKehadiranInst) chartKehadiranInst.destroy();
  chartKehadiranInst = new Chart($('chartKehadiran'), {
    type: 'bar',
    data: { labels, datasets: [{ label: 'Peserta Hadir', data, backgroundColor: '#C9A84C', borderRadius: 4 }] },
    options: {
      responsive:true, maintainAspectRatio:false,
      plugins:{ legend:{ display:false } },
      scales:{ y:{ beginAtZero:true, ticks:{ stepSize:1 } } }
    }
  });

  const tepatWaktu = Math.max(0, summary.totalRecord - summary.totalTerlambat);
  if(chartTerlambatInst) chartTerlambatInst.destroy();
  chartTerlambatInst = new Chart($('chartTerlambat'), {
    type: 'doughnut',
    data: {
      labels: ['Tepat Waktu / Lainnya', 'Terlambat'],
      datasets: [{ data: [tepatWaktu, summary.totalTerlambat], backgroundColor: ['#3F7052', '#B5483D'] }]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, font:{ size:11 } } } } }
  });
}

/* ====== EXPORT EXCEL ====== */
function exportExcel(){
  if(!currentRows.length){ alert('Tidak ada data untuk diexport.'); return; }
  const data = currentRows.map(r => ({
    Tanggal: r.tanggal, 'ID OJT': r.id, Nama: r.nama, Departemen: r.departemen,
    Jenis: r.jenis, Jam: r.jam, 'Jarak (m)': r.jarak, Status: r.terlambat ? 'Terlambat' : 'Tepat Waktu'
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{wch:12},{wch:10},{wch:22},{wch:16},{wch:9},{wch:10},{wch:9},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Rekap Absensi');
  const fname = `Rekap_Absensi_OJT_${$('fStart').value}_sd_${$('fEnd').value}.xlsx`;
  XLSX.writeFile(wb, fname);
}

/* ====== INIT ====== */
if(adminToken){ enterDashboard(); }
$('inpPass').addEventListener('keydown', e => { if(e.key==='Enter') doAdminLogin(); });
</script>
</body>
</html>
